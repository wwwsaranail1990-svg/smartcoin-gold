<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>SmartCoin Gold Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; margin: 0; }
        .header { text-align: center; padding: 20px; }
        .balance-box { font-size: 40px; font-weight: bold; color: #ffcc00; margin: 20px 0; }
        .mining-card { background: #1a1a1a; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #333; }
        .btn-invest { background: #ffcc00; color: #000; padding: 15px; border-radius: 10px; border: none; font-weight: bold; width: 80%; cursor: pointer; margin-top: 10px; }
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #111; padding: 15px; justify-content: space-around; }
    </style>
</head>
<body>
    <div class="header">
        <h3>مرحباً في SmartCoin Gold</h3>
        <div class="balance-box" id="balance">0.0000</div>
    </div>
    
    <div class="mining-card">
        <h3>تعدين تلقائي نشط ⚡</h3>
        <p>لا حاجة للتكبيس، الرصيد يزداد تلقائياً!</p>
        <button class="btn-invest" onclick="switchPage('wallet')">الذهاب للمحفظة والاستثمار</button>
    </div>

    <div class="nav">
        <div onclick="switchPage('home')">الرئيسية</div>
        <div onclick="switchPage('wallet')">المحفظة</div>
    </div>

    <script>
        // دالة جلب الرصيد التلقائي عند فتح التطبيق
        async function fetchBalance() {
            const response = await fetch('/api/mine', { 
                method: 'POST', 
                body: JSON.stringify({ telegram_id: window.Telegram.WebApp.initDataUnsafe.user.id }) 
            });
            const result = await response.json();
            document.getElementById('balance').innerText = result.balance.toFixed(4);
        }
        window.onload = fetchBalance;
    </script>
</body>
</html>
