<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCoin Gold Mining</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .balance-container {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            margin-top: 10px;
        }
        .coin-container {
            position: relative;
            margin: 30px 0;
        }
        .coin {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #ffe066 0%, #f5b041 70%, #d35400 100%);
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(245, 176, 65, 0.7), inset 0 0 20px rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.05s ease;
            border: 8px solid #b7950b;
        }
        .coin:active {
            transform: scale(0.92);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            width: 85%;
            background-color: #1a233a;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .stat-box {
            text-align: center;
        }
        .stat-label {
            font-size: 13px;
            color: #85929e;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #5dade2;
        }
    </style>
</head>
<body>

    <div class="header">
        <h3 id="welcomeUser">تحميل البيانات...</h3>
        <div class="balance-container" id="balance">0.0000</div>
    </div>

    <div class="coin-container">
        <div class="coin" id="coinBtn">🪙</div>
    </div>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-label">المستوى</div>
            <div class="stat-value" id="level">1</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">قوة الضربة</div>
            <div class="stat-value">+1</div>
        </div>
    </div>

    <script>
        // تفعيل تطبيق الويب الخاص بتلجرام
        const tg = window.Telegram.WebApp;
        tg.expand(); // فتح الواجهة بكامل الشاشة

        // جلب بيانات المستخدم من تلجرام
        const user = tg.initDataUnsafe?.user;
        const telegramId = user ? user.id : null;
        const username = user ? (user.username || user.first_name) : "المبرمج";

        document.getElementById('welcomeUser').innerText = `🪙 سبيكة: ${username}`;

        let balance = 0.0000;
        let miningLevel = 1;

        // جلب رصيد المستخدم الحقيقي من السيرفر عند فتح اللعبة
        if (telegramId) {
            fetch(`/api/user/${telegramId}`)
                .then(res => res.json())
                .then(data => {
                    if (data) {
                        balance = parseFloat(data.balance || 0);
                        miningLevel = data.mining_level || 1;
                        document.getElementById('balance').innerText = balance.toFixed(4);
                        document.getElementById('level').innerText = miningLevel;
                    }
                }).catch(err => console.error("خطأ في جلب البيانات:", err));
        }

        // عند الضغط على العملة لتعدين النقاط
        const coinBtn = document.getElementById('coinBtn');
        coinBtn.addEventListener('click', () => {
            balance += 1; // زيادة نقطة واحدة
            document.getElementById('balance').innerText = balance.toFixed(4);

            // إرسال النقاط الجديدة فوراً لحفظها في قاعدة البيانات Supabase
            if (telegramId) {
                fetch('/api/mine', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId, balance: balance })
                }).catch(err => console.error("خطأ في حفظ النقاط:", err));
            }
        });
    </script>
</body>
</html>
